<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caso de Estudio 3</title>
</head>
<body>
    <table border="1">
        <thead>
            <tr>
                <th colspan="5">Envios mensajeria</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Zonas mensajeria</td>
                <td>
                    <select id="id-select-zonas">
                        <option value="5" selected>5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td colspan="10" align="center">
                    <button id="id-btn-cargar-zonas">Cargar Zonas</button>
                </td>
            </tr>
            <tr>
                <td>
                    <button id="id-btn-presentar-Zonas">Presentar</button>
                </td>
                <td colspan="7">
                    <textarea name="" id="id-listado-Zonas" rows="5"  style="width: 100%;"  readonly >
                    </textarea>
                </td>
            </tr>
            <tr>
                <td> Zonas superiores al promedio: </td>
                    <td>
                        <input type="num" id="num-envios-superiores-promedio">
                    </td>
                </td>
                <td>
                    <button id="btn-envios-superiores-promedio"> Calcular</button>
                </td>
            </tr>
            <tr>
                <td>Zonas con servicio crítico </td>
                    <td>
                        <input type="num" id="num-servicio-critico">
                    </td>
                </td>
                <td>
                    <button id="btn-servicio-critico"> Calcular</button>
                </td>
            </tr>
              <tr>
                <td> Porcentaje de cada zona respecto al total </td>
                    <td>
                         <textarea name="" id="txt-porcentaje-zonas" rows="3" readonly>
                    </textarea>
                    </td>
                </td>
                <td>
                    <button id="btn-porcentaje-zonas"> Calcular</button>
                </td>
            </tr>
        </tbody>
        <tfoot></tfoot>
    </table>

    <script type="module" src="../caso de estudio 3/js/app-caso3.js"></script>
</body>
</html>
